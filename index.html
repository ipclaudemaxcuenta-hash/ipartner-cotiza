<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iPartner · Habla con Jaina</title>
<meta name="theme-color" content="#2A1758">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --p900:#17122B; --p700:#2E1A63; --p600:#412780; --p500:#5B34B8; --p400:#7C5CE0; --p100:#EEE9FB; --p50:#F7F5FD;
  --orange:#EF801C; --txt:#17122B; --mut:#6B6584; --line:#E6E1F2; --card:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased;
  background:radial-gradient(90% 70% at 15% 0%,#5B34B8 0%,transparent 60%),radial-gradient(80% 60% at 100% 100%,#8E1F7A 0%,transparent 55%),var(--p900);
  background-attachment:fixed;display:flex;flex-direction:column;min-height:100dvh}

.top{display:flex;align-items:center;justify-content:space-between;padding:22px 32px;color:#fff}
.top img{height:28px}
.top span{font-size:13px;opacity:.7}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 16px 40px}
.card{width:100%;max-width:600px;transition:max-width .4s cubic-bezier(.2,.8,.2,1);background:var(--card);border-radius:28px;padding:32px 36px 28px;
  box-shadow:0 40px 100px -30px rgba(0,0,0,.6);display:flex;flex-direction:column}

/* ---- cabecera con Jaina + progreso ---- */
.who{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.who .mlogo{display:none}
.orb{position:relative;width:36px;height:36px;flex:none;aspect-ratio:1}
.orb::before{content:"";position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(closest-side,rgba(124,77,255,.45),transparent 70%);animation:glow 4.6s ease-in-out infinite}
.orb img{position:absolute;left:-12%;top:-12%;width:124%;height:124%;max-width:none;object-fit:contain;-webkit-mask:radial-gradient(closest-side,#000 72%,transparent);mask:radial-gradient(closest-side,#000 72%,transparent);animation:breath 4.6s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes glow{0%,100%{opacity:.4}50%{opacity:1}}
.who b{font:600 15px Sora}
.who small{display:block;font-size:12px;color:var(--mut)}
.count{margin-left:auto;font-size:13px;color:var(--mut);font-weight:500;font-variant-numeric:tabular-nums}
.count b{color:var(--p600)}

.progress{height:8px;border-radius:99px;background:var(--p100);overflow:hidden;margin-bottom:34px}
.progress i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--p600),var(--p400));
  transition:width .6s cubic-bezier(.2,.8,.2,1);position:relative}
.progress i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:shine 2.4s infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* ---- pregunta ---- */
.q{display:flex;flex-direction:column}
@media (max-width:640px){.q{flex:1}}
.q.in{animation:in .45s cubic-bezier(.2,.8,.2,1)}
.q.back{animation:inb .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
h1{font:700 clamp(26px,5vw,31px)/1.18 Sora;letter-spacing:-.03em;color:var(--txt);text-wrap:balance}
.help{font-size:16px;line-height:1.55;color:var(--mut);margin-top:12px;text-wrap:balance}

.opts{display:grid;gap:12px;margin-top:26px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
  background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:16px 18px;position:relative;
  transition:border-color .2s,background .2s,box-shadow .2s,transform .2s}
.opt:hover{border-color:#C9BCF0;transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(65,39,128,.45)}
.opt:active{transform:translateY(0) scale(.99)}
.opt:focus-visible{outline:3px solid rgba(91,52,184,.35);outline-offset:2px}
.opt .ic{width:44px;height:44px;flex:none;border-radius:13px;background:var(--p50);display:grid;place-items:center;color:var(--p600);transition:background .2s,color .2s}
.opt .ic svg{width:22px;height:22px}
.opt .tx{flex:1}
.opt .tx b{display:block;font-weight:600;font-size:16px}
.opt .tx span{display:block;font-size:13.5px;color:var(--mut);margin-top:2px}
.opt .mk{width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid #CFC8E3;display:grid;place-items:center;transition:.15s}
.opt.multi .mk{border-radius:7px}
.opt .mk svg{width:14px;height:14px;color:#fff;opacity:0;transform:scale(.4);transition:opacity .15s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.opt.sel{border-color:var(--p500);background:linear-gradient(135deg,#F7F4FF,#F1ECFD);box-shadow:0 0 0 4px rgba(91,52,184,.1),0 10px 24px -16px rgba(65,39,128,.6)}
.opt.sel .ic{background:linear-gradient(135deg,var(--p600),var(--p400));color:#fff}
.opt.sel .mk{background:var(--p500);border-color:var(--p500)}
.opt.sel .mk svg{opacity:1;transform:scale(1)}
.opts.grid2{grid-template-columns:1fr 1fr}
.opts.tiles{grid-template-columns:repeat(4,1fr)}
.tile{flex-direction:column;align-items:flex-start;gap:16px;padding:18px 16px 16px}
.tile .mk{position:absolute;top:14px;right:14px}
.lvl{display:flex;align-items:flex-end;gap:4px;height:28px}
.lvl i{width:7px;border-radius:3px;background:#E3DCF5;transition:background .2s}
.lvl i:nth-child(1){height:30%}.lvl i:nth-child(2){height:55%}.lvl i:nth-child(3){height:78%}.lvl i:nth-child(4){height:100%}
.lvl i.on{background:var(--p400)}
.opt.sel .lvl i.on{background:var(--p600)}
.tile .num{display:block;width:100%}
.tile .tnum{display:block;font:700 24px/1 Sora;letter-spacing:-.03em;color:var(--txt);white-space:nowrap}
.tile .sm{font-size:13px;color:var(--mut);margin-top:6px;display:block}
.card.wide{max-width:860px}
.card.wide h1{max-width:none}

.fields{display:grid;gap:16px;margin-top:28px}
.fields label{display:grid;gap:6px;align-content:start;font-size:13px;font-weight:500;color:var(--mut)}
.pre{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:14px;transition:.15s}
.pre:focus-within{border-color:var(--p500);box-shadow:0 0 0 4px rgba(91,52,184,.12)}
.pre b{font:500 17px Inter;color:var(--mut);padding:0 12px 0 16px;margin-right:4px;border-right:1.5px solid #D6CFE8;line-height:24px}
.pre .inp{border:0;box-shadow:none!important;padding-left:6px}
.fields{grid-template-columns:2fr 3fr}
.fields>*{grid-column:1/-1}
.fields>label.half{grid-column:auto;min-width:0}
.fields label em{font-style:normal;font-weight:400;color:var(--mut)}
.inp{width:100%;font:500 17px Inter;color:var(--txt);background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;outline:none;transition:.15s}
.inp:focus{border-color:var(--p500);box-shadow:0 0 0 4px rgba(91,52,184,.12)}
.inp::placeholder{color:#A9A3BD}
textarea.inp{min-height:150px;resize:vertical;line-height:1.5}
.big{font:700 34px Sora;padding:14px 18px;letter-spacing:-.02em}
.unit{font-size:14px;color:var(--mut);margin-top:-6px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--mut);margin-top:18px;cursor:pointer}
.consent a{color:var(--p600);font-weight:600}.consent em{font-style:normal;opacity:.8}
.consent input{accent-color:var(--p500);width:18px;height:18px;flex:none;margin-top:1px}
.err{color:#C2410C;font-size:13.5px;margin-top:14px;font-weight:500}
.err:empty{display:none}

/* ---- navegación ---- */
.nav{display:flex;gap:12px;margin-top:30px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 16px Inter;border-radius:14px;padding:15px 20px;cursor:pointer;transition:.15s;border:1.5px solid transparent}
.btn svg{width:18px;height:18px}
.btn.prev{background:#fff;border-color:var(--line);color:var(--txt);flex:0 0 38%}
.btn.prev:hover{border-color:#CFC8E3}
.btn.next{background:var(--p600);color:#fff;box-shadow:0 10px 24px -10px rgba(65,39,128,.8)}
.btn.next:hover{background:var(--p500)}
.btn.next:disabled{background:#CFC8E3;box-shadow:none;cursor:not-allowed}
.btn.hide{display:none}
.legal{font-size:12px;line-height:1.5;color:#9A94AE;text-align:center;margin-top:14px;text-wrap:balance}
.legal a{color:inherit;text-decoration:underline}

/* ---- final ---- */
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.end .orb{width:96px;height:96px;margin-bottom:10px}
.end .help{max-width:400px}
.cta{display:inline-flex;gap:14px;align-items:center;margin-top:18px;text-decoration:none;font:500 17px Inter;color:#fff;
  background:linear-gradient(135deg,var(--p600),var(--p400));padding:8px 8px 8px 26px;border-radius:16px;box-shadow:0 14px 30px -12px rgba(91,52,184,.75);transition:transform .2s,box-shadow .2s}
.cta .arr{width:44px;height:44px;border-radius:11px;background:#fff;color:var(--p600);display:grid;place-items:center;overflow:hidden}
.cta .arr svg{width:20px;height:20px;transition:transform .25s}
.cta:hover{transform:translateY(-2px);box-shadow:0 18px 36px -12px rgba(91,52,184,.85)}
.cta:hover .arr svg{transform:translate(2px,-2px)}
.foot{text-align:center;font-size:12px;color:rgba(255,255,255,.6);padding:0 16px 20px}

@media (max-width:640px){
  body{background-attachment:scroll}
  .top,.foot{display:none}
  main{padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));align-items:stretch}
  .card{border-radius:28px;padding:clamp(14px,2.6dvh,22px) 20px clamp(14px,2.4dvh,20px);min-height:calc(100dvh - 24px);box-shadow:0 20px 60px -20px rgba(0,0,0,.6)}
  .who .orb,.who>div:not(.count){display:none}
  .who .mlogo{display:block;height:24px;width:auto}
  .who{margin-bottom:clamp(10px,2.2dvh,18px)}
  .count{font-size:13px}
  .progress{height:8px;margin-bottom:clamp(14px,2.8dvh,22px)}
  h1{font-size:clamp(22px,3.9dvh,27px);line-height:1.16}
  .help{font-size:clamp(14px,2.2dvh,15.5px);margin-top:clamp(4px,1dvh,10px)}
  .fields{gap:clamp(8px,1.8dvh,14px);margin-top:clamp(14px,3dvh,24px)}
  .fields label{gap:clamp(3px,.7dvh,6px)}
  .fields>label.half{grid-column:1/-1}
  .inp{padding:clamp(10px,1.8dvh,14px) 16px;font-size:16px}
  .opts{margin-top:clamp(12px,2.6dvh,22px);gap:clamp(6px,1.2dvh,10px)}
  .opts.grid2{grid-template-columns:1fr}
  .opts.tiles{grid-template-columns:1fr 1fr}
  .opt{padding:clamp(8px,1.6dvh,14px) 14px}.opt .ic{width:clamp(30px,5dvh,40px);height:clamp(30px,5dvh,40px)}
  .opts.compact .opt{padding:clamp(6px,1.2dvh,9px) 12px;gap:12px}.opts.compact .ic{width:clamp(28px,4.4dvh,32px);height:clamp(28px,4.4dvh,32px);border-radius:10px}.opts.compact .ic svg{width:18px;height:18px}.opts.compact .tx b{font-size:15px}.opts.compact .tx span{display:none}
  .nav{margin-top:auto;padding-top:clamp(10px,2dvh,20px)}
  .btn{padding:clamp(11px,1.9dvh,15px) 16px}
  .legal{margin-top:clamp(6px,1.4dvh,12px);font-size:11.5px}
  .end .orb{width:90px;height:90px}
}

.badge{display:inline-flex;gap:6px;align-items:center;font:600 13px Inter;color:#0F7B4B;background:#E7F8EF;border:1px solid #BFEBD3;padding:6px 12px;border-radius:999px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;opacity:.9;animation:fall linear forwards}
@keyframes fall{to{top:105%;transform:translateX(40px) rotate(720deg)}}
.skip{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:50;font:600 13px Inter;color:#fff;background:#EF801C;border:0;border-radius:999px;
  padding:10px 16px;cursor:pointer;box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}
.otro{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .3s ease,opacity .3s ease,margin .3s}
.otro>label{overflow:hidden;display:grid;gap:6px;font-size:13px;font-weight:500;color:var(--mut)}
.otro.on{grid-template-rows:1fr;opacity:1;margin-top:14px}
.inp.bad,.pre.bad{border-color:#E5484D!important;box-shadow:0 0 0 4px rgba(229,72,77,.12)!important;background:#FFF8F8}
.pre.bad .inp{background:transparent}
.bad-l{color:#D92D20!important}
.sug{font:inherit;font-weight:700;color:var(--p600);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.ferr{display:block;color:#D92D20;font-size:12.5px;font-weight:500;margin-top:2px;animation:in .25s ease}
.err{color:#D92D20}
.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const data = {}; let k = 0;
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const first = s => { const w = String(s||'').trim().split(/\s+/)[0]; return esc(w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()); };
const fine = matchMedia('(pointer:fine)').matches;

function render(dir='in'){
  const q = Q[k], box = $('q');
  $('err').textContent = '';
  document.querySelector('.card').classList.toggle('wide', !!q.wide);
  $('bar').style.width = ((k+1)/(Q.length+1)*100)+'%';
  $('count').innerHTML = `Paso <b>${k+1}</b> de ${Q.length}`;
  $('prev').classList.toggle('hide', k===0);
  $('legal').style.display = q.consent ? '' : 'none';
  $('next').firstChild.textContent = k===Q.length-1 ? 'Enviar' : 'Continuar';
  const title = typeof q.title==='function' ? q.title(data) : q.title;
  let h = `<h1>${title}</h1>${q.help?`<p class="help">${q.help}</p>`:''}`;

  if (q.type==='one' || q.type==='many'){
    const cur = data[q.id];
    h += `<div class="opts ${q.tiles?'tiles':''} ${q.cols?'grid2':''} ${q.type==='many'?'compact':''}">` + q.opts.map(([t,s,icon])=>{
      const sel = q.type==='one' ? cur===t : (cur||[]).includes(t);
      if (q.tiles) return `<button type="button" class="opt tile ${sel?'sel':''}" data-v="${esc(t)}" aria-label="${esc(t)} trabajadores">
        <span class="lvl">${[1,2,3,4].map(n=>`<i class="${n<=icon?'on':''}"></i>`).join('')}</span>
        <span class="num"><span class="tnum">${s}</span><span class="sm">trabajadores</span></span><span class="mk">${CHECK}</span></button>`;
      return `<button type="button" class="opt ${q.type==='many'?'multi':''} ${sel?'sel':''}" data-v="${esc(t)}">
        <span class="ic">${icon}</span><span class="tx"><b>${esc(t)}</b>${s?`<span>${s}</span>`:''}</span><span class="mk">${CHECK}</span></button>`;
    }).join('') + '</div>';
  }
  if (q.type==='fields'){
    h += '<div class="fields">' + q.fields.map(f=>`<label${f.half?' class="half"':''}><span>${f.l}${f.opt?' <em>(opcional)</em>':''}</span>
      ${f.t==='tel'?'<span class="pre"><b>+51</b>':''}<input class="inp" name="${f.n}" type="${f.t||'text'}" placeholder="${f.ph}" value="${esc(data[f.n]||'')}" ${f.ac?`autocomplete="${f.ac}"`:''} ${f.im?`inputmode="${f.im}"`:''} ${f.max?`maxlength="${f.max}"`:''}>${f.t==='tel'?'</span>':''}</label>`).join('') + '</div>';
  }
  if (q.type==='number') h += `<div class="fields"><input class="inp big" name="volumen" type="number" min="0" inputmode="numeric" placeholder="0" value="${data.volumen??''}"><p class="unit">personas al mes</p></div>`;
  if (q.extra) h += `<div class="otro ${(data[q.id]||[]).includes('Otro')?'on':''}" id="otro"><label>Cuéntanos cuál es el problema<input class="inp" name="contexto" placeholder="Ej. Muchas faltas en el primer mes" value="${esc(data.contexto||'')}"></label></div>`;
  if (q.type==='long') h += `<div class="fields"><textarea class="inp" name="contexto" placeholder="Escribe aquí (opcional)">${esc(data.contexto||'')}</textarea></div>`;

  box.className = 'q'; void box.offsetWidth; box.className = 'q '+dir;
  box.innerHTML = h;
  const inp = box.querySelector('.inp'); if (inp && fine) inp.focus();
  updateNext();
}

function collect(){
  const q = Q[k];
  $('q').querySelectorAll('input,textarea').forEach(el=>{
    if (el.type==='checkbox') data[el.name]=el.checked; else data[el.name]=el.value.trim();
  });
  if (q.type==='number' && data.volumen!=='') data.volumen = Number(data.volumen);
}
/* ---- correo: formato y errores de tipeo comunes ---- */
const EMAIL_OK = /^[^\s@]+@[^\s@.]+(\.[^\s@.]+)*\.[a-z]{2,}$/i;
const TYPO_TLD = {con:'com',cmo:'com',coom:'com',comm:'com',vom:'com',xom:'com',cpm:'com',ocm:'com',cim:'com',cm:'com',om:'com',
  'con.pe':'com.pe','cmo.pe':'com.pe','com.pee':'com.pe','com.p':'com.pe',pee:'pe',ner:'net',nte:'net',ogr:'org',og:'org'};
const TYPO_DOM = {gmial:'gmail',gamil:'gmail',gmal:'gmail',gmai:'gmail',gnail:'gmail',gmil:'gmail',gmaill:'gmail',gemail:'gmail',
  hotmial:'hotmail',hotmal:'hotmail',hotmai:'hotmail',homail:'hotmail',hotmil:'hotmail',hormail:'hotmail',
  outlok:'outlook',outllok:'outlook',outloo:'outlook',otlook:'outlook',yaho:'yahoo',yahooo:'yahoo',yhoo:'yahoo'};
Mailcheck.defaultTopLevelDomains.push('com.pe','pe','edu.pe','gob.pe','org.pe','net.pe');
Mailcheck.defaultDomains.push('hotmail.es','outlook.es','yahoo.es');
function emailFix(v){
  const mc = window.Mailcheck && Mailcheck.run({email:String(v).trim()});
  if (mc && mc.full) return mc.full;
  const m = String(v).trim().toLowerCase().match(/^([^\s@]+)@([^\s@.]+)\.(.+)$/); if (!m) return null;
  const dom = TYPO_DOM[m[2]] || m[2], tld = TYPO_TLD[m[3]] || m[3];
  const fixed = `${m[1]}@${dom}.${tld}`;
  return fixed !== `${m[1]}@${m[2]}.${m[3]}` ? fixed : null;
}

function updateNext(){ $('next').disabled = false; }

/* ---- errores por campo ---- */
function boxOf(el){ return el.closest('.pre') || el; }
function markErr(el, msg){
  boxOf(el).classList.add('bad');
  const lab = el.closest('label') || el.parentElement;
  lab.classList.add('bad-l');
  let m = lab.querySelector('.ferr');
  if (!m){ m = document.createElement('small'); m.className = 'ferr'; lab.appendChild(m); }
  m.innerHTML = msg;
}
function clearErr(el){
  boxOf(el).classList.remove('bad');
  const lab = el.closest('label') || el.parentElement;
  lab.classList.remove('bad-l');
  lab.querySelector('.ferr')?.remove();
}
function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

function validate(){
  const q = Q[k], box = $('q'), bad = [];
  $('err').textContent = '';
  box.querySelectorAll('.inp').forEach(clearErr);
  const inp = n => box.querySelector(`[name="${n}"]`);
  const need = (n, msg) => { const el = inp(n); markErr(el, msg); bad.push(boxOf(el)); };

  if (q.type==='fields') for (const f of q.fields){
    const v = data[f.n]||'';
    if (!f.opt && !v) need(f.n, 'Falta completar '+f.l.charAt(0).toLowerCase()+f.l.slice(1)+'.');
    else if (f.t==='email' && emailFix(v) && data._correoOk!==v){ data._correoOk = v; need(f.n, `¿Quisiste decir <button type="button" class="sug" data-n="${f.n}">${esc(emailFix(v))}</button>? Si tu correo está bien, presiona Continuar otra vez.`); }
    else if (f.t==='email' && !EMAIL_OK.test(v)) need(f.n, 'Revisa el correo, parece incompleto.');
    else if (f.t==='tel' && v.replace(/\D/g,'').length<9) need(f.n, 'El celular debe tener 9 dígitos.');
  }
  if (q.type==='number' && (data.volumen==='' || isNaN(data.volumen) || data.volumen<0)) need('volumen', 'Escribe un número aproximado.');
  if (q.extra && (data[q.id]||[]).includes('Otro') && !data.contexto) need('contexto', 'Cuéntanos brevemente cuál es el otro problema.');
  if ((q.type==='one' && !data[q.id]) || (q.type==='many' && !(data[q.id]||[]).length)){
    $('err').textContent = q.type==='one' ? 'Elige una opción para continuar.' : 'Elige al menos una opción para continuar.';
    bad.push(box.querySelector('.opts'));
  }
  if (!bad.length) return true;
  bad.forEach(shake);
  (box.querySelector('.bad input, input.bad') || {focus(){}}).focus();
  return false;
}

$('q').addEventListener('click', e=>{
  const sg = e.target.closest('.sug');
  if (sg){ const el = $('q').querySelector(`[name="${sg.dataset.n}"]`); el.value = data[sg.dataset.n] = sg.textContent; clearErr(el); el.focus(); return; }
  const o = e.target.closest('.opt'); if (!o) return;
  $('err').textContent='';
  const q = Q[k], v = o.dataset.v;
  if (q.type==='one'){
    data[q.id] = v;
    $('q').querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel', x===o));
    updateNext(); setTimeout(go, 320);
  } else {
    o.classList.toggle('sel');
    data[q.id] = [...$('q').querySelectorAll('.opt.sel')].map(x=>x.dataset.v);
    const otro = $('otro');
    if (otro && v==='Otro'){ otro.classList.toggle('on', o.classList.contains('sel')); if (otro.classList.contains('on')) setTimeout(()=>otro.querySelector('input').focus(),200); }
    updateNext();
  }
});
$('q').addEventListener('input', e=>{ $('err').textContent=''; if (e.target.classList.contains('inp')) clearErr(e.target); });
function go(){
  collect(); if (!validate()) return;
  if (k===0){ data.acepta = true; data.consentimiento = {texto: $('legal').textContent.trim(), fecha: new Date().toISOString()}; guardarParcial(); }
  if (k < Q.length-1){ k++; render('in'); } else finish();
}
$('next').onclick = go;
$('prev').onclick = ()=>{ collect(); if (k>0){ k--; render('back'); } };
document.addEventListener('keydown', e=>{
  if (e.key==='Enter' && e.target.tagName!=='TEXTAREA' && !$('next').disabled && $('nav').style.display!=='none'){ e.preventDefault(); go(); }
});

function calificar(d){
  const v = Number(d.volumen), t = TRAB_OK.includes(d.trabajadores), m = [];
  if (!t) m.push('Trabajadores: '+d.trabajadores);
  if (v < MIN_VOLUMEN) m.push(`Volumen mensual: ${v} (mínimo ${MIN_VOLUMEN})`);
  let estado = 'califica';
  if (v < ZONA_GRIS || (!t && v < MIN_VOLUMEN)) estado = 'no califica';
  else if (m.length) estado = 'revisar';
  return {estado, califica: estado==='califica', motivos:m};
}
async function finish(){
  Object.assign(data, calificar(data), {completo:true, enviado:new Date().toISOString()});
  await enviar(data);
  $('bar').style.width='100%'; $('count').innerHTML='¡Completado!'; $('nav').style.display='none';
  const ok = data.estado==='califica', nom = data.nombre ? first(data.nombre) : '';
  $('q').className='q in';
  $('q').innerHTML = `<div class="end"><div class="orb">${document.querySelector('.who .orb').innerHTML}</div>
    ${ok ? `<span class="badge">✓ Tu empresa califica</span>` : ''}
    <h1>${ok ? '¡Felicidades' : '¡Gracias'}${nom ? ', '+nom : ''}!</h1>
    <p class="help">${ok
      ? 'Preparamos una propuesta personalizada para tu empresa. Un asesor te llamará muy pronto.'
      : 'Tu solicitud está en proceso de evaluación. Nuestro equipo la revisará y te contactará con las opciones que mejor se ajusten a tu empresa.'}</p>
    <a class="cta" href="https://www.linkedin.com/company/grupo-ipartner" target="_blank" rel="noopener">Síguenos en LinkedIn<span class="arr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg></span></a></div>`;
  if (ok) confeti();
}
function confeti(){
  const c = document.createElement('div'); c.className = 'confetti';
  const col = ['#5B34B8','#7C5CE0','#EF801C','#8E1F7A','#B99BFF'];
  for (let i=0;i<60;i++){ const p = document.createElement('i');
    p.style.cssText = `left:${Math.random()*100}%;background:${col[i%5]};animation-delay:${Math.random()*.6}s;animation-duration:${2.2+Math.random()*1.6}s;transform:rotate(${Math.random()*360}deg)`;
    c.appendChild(p); }
  document.body.appendChild(c); setTimeout(()=>c.remove(), 4500);
}

// Pendiente: conectar a Supabase. Por ahora solo muestra la respuesta en la consola.
// Se guarda apenas termina la pantalla 1 (lead parcial) y se actualiza al final con el mismo id.
const LEAD_ID = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
function guardarParcial(){ delete data._correoOk; enviar({...data, completo:false, estado:'parcial', creado:new Date().toISOString()}); }
async function enviar(d){ console.log('Respuesta del formulario:', JSON.stringify({id:LEAD_ID, origen:'linkedin', ...d})); }

if (MODO_PRUEBA){
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'skip'; b.textContent = 'Modo prueba: saltar ›';
  b.onclick = ()=>{ collect(); if (k < Q.length-1){ k++; render('in'); } else finish(); };
  document.body.appendChild(b);
}
render();
</script>
